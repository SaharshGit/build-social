[project]
name = "buildsocial"
version = "0.1.0"
description = "BuildSocial: a model-agnostic multi-agent harness for social media content"
readme = "README.md"
requires-python = ">=3.12"
# Dependencies are added one at a time, as each build step needs them.
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

# Installs a `buildsocial` command that calls buildsocial.cli.main()
[project.scripts]
buildsocial = "buildsocial.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"  # lets tests be `async def` without extra decorators
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
