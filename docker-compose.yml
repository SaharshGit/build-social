# Local development services. Start: docker compose up -d   Stop: docker compose down
# (Data survives "down"; only "docker compose down -v" deletes the database.)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: buildsocial
      POSTGRES_DB: buildsocial
      # Read from .env (git-ignored); compose refuses to start if it's missing.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      # 127.0.0.1 = reachable only from this laptop, not from other devices on the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data  # the database files, kept across restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buildsocial -d buildsocial"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
