# Reviewer evals: hand-written posts where the right answer is known.
#
# clean: true  -> the post breaks no rule; ANY issue is a false alarm.
# planted      -> problems written in on purpose; each must be flagged (an issue quoting it).
#                 types: the issue types that count as correct for it.
#                 judge: which judge list should catch it (invented / promised), or omit if the judge shouldn't.
# Everything else in a planted post is written to be clean, so extra issues are counted as false alarms
# (and printed, so a person can check whether the post really had a problem).
#
# Posts use the plan and approved facts of the matching start in evals/revision_starts (same research).
# Run:  uv run buildsocial eval-reviewer --label baseline

cases:
  # ---------------------------------------------------------------- Brew House (Hinglish, Instagram)
