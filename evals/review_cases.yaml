    start: brewhouse-chai-instagram
    clean: true
    draft:
      hook: "Cold chai weather, anyone?"
      body: "Our new Masala Chai Cold Brew is here at the Indiranagar cafe: black tea, cardamom, cinnamon and ginger, cold-brewed and served over ice. No added artificial syrups, bas wahi classic masala kick. Bengaluru ka pleasant November weather is just right for it."
      call_to_action: "Drop by this week and tell us what you think."
      hashtags: ["#BrewHouse", "#MasalaChaiColdBrew", "#Bengaluru", "#Indiranagar"]

  - id: brew-health-claim
