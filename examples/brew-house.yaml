# Fictional brand for development and testing. Real brands will come from users via the app.
name: Brew House
industry: specialty coffee cafe
market: Bengaluru
description: >
  A specialty coffee café in Indiranagar, Bengaluru. Single-origin Indian beans
  from Chikmagalur and Coorg, pour-overs, cold brews, and filter coffee with a twist.
  Cosy space popular for remote work and weekend catch-ups.
audience: >
  Bengaluru professionals and students aged 22-35 who care about good coffee,
  work from cafés, and follow local food culture on Instagram and LinkedIn.
voice: Warm, playful and a little nerdy about coffee. Friendly, never pushy or salesy.
language: Hinglish
content_pillars:
  - Coffee origins and brewing tips
  - Behind the counter (baristas, roasting, daily life)
  - Seasonal specials and offers
  - Bengaluru life and community
dos:
  - Celebrate Indian coffee farmers and origins
  - Use light humour and local Bengaluru references
  - Keep emojis to a few per post
donts:
  - Never mention or compare with competitor cafés or chains
  - No discount-shouting or ALL CAPS
  - Don't make health claims about coffee
example_posts:
  - "Monday ko thoda gentle banate hain ☕ Our Coorg pour-over is fruity, bright, and basically a hug in a cup. Come say hi — wifi strong, chairs comfy."
  - "Filter coffee, but make it cold. 🧊 Our new Cold Filter Kaapi is here for the Bengaluru afternoons that refuse to cool down."
# Product facts: the ONLY source for claims about Brew House's own products (fictional brand).
products:
  - name: Masala Chai Cold Brew
    description: New seasonal drink at the Indiranagar cafe.
    key_ingredients: [black tea, cardamom, cinnamon, ginger]
    approved_claims:
      - New on the menu
      - Masala chai, cold-brewed and served over ice
      - No added artificial syrups
# Visual identity (fictional; proposed 2026-11-26). Fonts are Google Fonts, free for commercial use.
design:
  colors:
    - {name: Oat cream, hex: "#F3EADB", role: background}
    - {name: Espresso, hex: "#2E1D14", role: text}
    - {name: Chai, hex: "#C9772F", role: accent}
    - {name: Cardamom, hex: "#7C8C5A", role: secondary}
    - {name: Brass, hex: "#D9A441", role: highlight}
  fonts:
    heading: {family: Fraunces, weights: [600, 800]}
    body: {family: DM Sans, weights: [400, 600]}
  art_direction: >
    Natural warm daylight and real cafe textures: wood, ceramic, a steel davara-tumbler. Drinks in close-up,
    with condensation on cold ones. Earthy tones. No stock-photo models, no neon, no text in photos.
  visual_dos:
    - Plenty of empty space around the text
    - One hero photo per image
    - Logo small, in a corner
  visual_donts:
    - No ALL CAPS
    - No discount badges or starbursts
